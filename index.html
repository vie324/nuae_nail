<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuae Nail - Salon Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%85%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // SMOKY ROSE — Nuae brand primary (#B08C80)
            brand: {
              50:  '#faf5f3',
              100: '#f3e7e2',
              200: '#e8d2c8',
              300: '#d6b5a7',
              400: '#c39d8e',
              500: '#b08c80',
              600: '#967060',
              700: '#7a5a4e',
              800: '#5e4439',
              900: '#3f2d26'
            },
            // Subtle gold accent (from the brand underline)
            gold: {
              400: '#cfa46c',
              500: '#b78a54',
              600: '#9b7340'
            }
          },
          fontFamily: {
            sans: ['"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
  <!-- Splash screen (shown instantly, before React hydrates) -->
  <div id="splash" aria-hidden="true">
    <div class="splash-wrap">
      <img src="assets/logo.svg" alt="Nuae" class="splash-img" />
      <div class="splash-loader" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div class="splash-glow splash-glow-1"></div>
    <div class="splash-glow splash-glow-2"></div>
  </div>

  <div id="root"></div>

  <script type="text/babel" src="js/data.js"></script>
  <script type="text/babel" src="js/components/Icons.js"></script>
  <script type="text/babel" src="js/components/UI.js"></script>
  <script type="text/babel" src="js/components/Sidebar.js"></script>
  <script type="text/babel" src="js/components/Header.js"></script>
  <script type="text/babel" src="js/pages/Dashboard.js"></script>
  <script type="text/babel" src="js/pages/Reservations.js"></script>
  <script type="text/babel" src="js/pages/Customers.js"></script>
  <script type="text/babel" src="js/pages/Designs.js"></script>
  <script type="text/babel" src="js/pages/Line.js"></script>
  <script type="text/babel" src="js/pages/Shifts.js"></script>
  <script type="text/babel" src="js/pages/Staff.js"></script>
  <script type="text/babel" src="js/pages/Marketing.js"></script>
  <script type="text/babel" src="js/pages/Integrations.js"></script>
  <script type="text/babel" src="js/pages/Counseling.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
